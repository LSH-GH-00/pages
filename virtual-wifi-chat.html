<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Virtual Wi-Fi P2P Chat</title>
	<style>
		body { font-family: sans-serif; max-width: 800px; margin: 30px auto; padding: 0 15px; }
		#status { padding: 10px; border: 1px solid #888; margin-bottom: 15px; }
		#messages { border: 1px solid #888; min-height: 300px; padding: 10px; overflow-y: auto; }
		.message { margin: 8px 0; padding: 8px; border-bottom: 1px solid #aaa; }
		.meta { font-size: 0.8em; opacity: 0.7; }
		#sendForm { display: flex; gap: 8px; margin-top: 15px; }
		#message { flex: 1; padding: 10px; }
		button { padding: 10px 15px; cursor: pointer; }
		code { word-break: break-all; }
	</style>
</head>
<body>
	<h1>Virtual Wi-Fi P2P Chat</h1>
	<div id="status">연결 중...</div>
	<p>Cell: <strong>1</strong></p>
	<p>MAC: <code id="mac"></code></p>
	<div id="messages"></div>
	<form id="sendForm">
		<input id="message" type="text" placeholder="메시지 입력" autocomplete="off" required>
		<button type="submit">전송</button>
	</form>

	<script>
		const SUPABASE_URL = "https://uhqdbmofvrontpgtzlxv.supabase.co";
		const SUPABASE_KEY = "sb_publishable_pY5uodEIyqFilDstsiV6zA_UUi2yDTz";
		const CELL_ID = 1;
		const REST_URL = SUPABASE_URL + "/rest/v1/virtual_wifi";
		const REALTIME_URL = SUPABASE_URL.replace("https://", "wss://") + "/realtime/v1/websocket?apikey=" + encodeURIComponent(SUPABASE_KEY) + "&vsn=1.0.0";
		const BROADCAST = "FF:FF:FF:FF:FF:FF";

		let mac = localStorage.getItem("virtual_wifi_mac");
		if (!mac) {
			const bytes = crypto.getRandomValues(new Uint8Array(6));
			mac = Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join(":");
			localStorage.setItem("virtual_wifi_mac", mac);
		}
		document.getElementById("mac").textContent = mac;

		function headers() {
			return {
				"apikey": SUPABASE_KEY,
				"Authorization": "Bearer " + SUPABASE_KEY,
				"Content-Type": "application/json"
			};
		}

		async function readCell() {
			const response = await fetch(REST_URL + "?id=eq." + CELL_ID + "&select=id,frames", {
				headers: headers()
			});
			if (!response.ok) throw new Error("읽기 오류 " + response.status + ": " + await response.text());
			const rows = await response.json();
			if (!rows.length) throw new Error("CELL 1이 없습니다.");
			return rows[0].frames || [];
		}

		async function writeCell(frames) {
			const response = await fetch(REST_URL + "?id=eq." + CELL_ID, {
				method: "PATCH",
				headers: headers(),
				body: JSON.stringify({ frames: frames })
			});
			if (!response.ok) throw new Error("쓰기 오류 " + response.status + ": " + await response.text());
		}

		function makeFrame(data) {
			return {
				version: 1,
				type: "DATA",
				source: mac,
				destination: BROADCAST,
				sequence: crypto.randomUUID(),
				data: data,
				time: new Date().toISOString()
			};
		}

		function showFrame(frame) {
			if (!frame || frame.type !== "DATA" || frame.source === mac) return;
			if (document.querySelector('[data-sequence="' + frame.sequence + '"]')) return;
			const item = document.createElement("div");
			item.className = "message";
			item.dataset.sequence = frame.sequence;
			const meta = document.createElement("div");
			meta.className = "meta";
			meta.textContent = frame.source + " · " + new Date(frame.time).toLocaleTimeString();
			const text = document.createElement("div");
			text.textContent = frame.data;
			item.append(meta, text);
			document.getElementById("messages").appendChild(item);
		}

		async function receiveFrames() {
			try {
				const frames = await readCell();
				for (const frame of frames) showFrame(frame);
			} catch (error) {
				console.error(error);
				document.getElementById("status").textContent = "수신 오류: " + error.message;
			}
		}

		async function sendFrame(frame) {
			const frames = await readCell();
			frames.push(frame);
			if (frames.length > 100) frames.splice(0, frames.length - 100);
			await writeCell(frames);
		}

		document.getElementById("sendForm").addEventListener("submit", async event => {
			event.preventDefault();
			const input = document.getElementById("message");
			const text = input.value.trim();
			if (!text) return;
			try {
				await sendFrame(makeFrame(text));
				input.value = "";
				document.getElementById("status").textContent = "전송 완료 · CELL 1";
				await receiveFrames();
			} catch (error) {
				console.error(error);
				document.getElementById("status").textContent = "전송 오류: " + error.message;
			}
		});

		function startRealtime() {
			try {
				const ws = new WebSocket(REALTIME_URL);
				ws.onopen = () => {
					ws.send(JSON.stringify({ topic: "realtime:virtual-wifi", event: "phx_join", payload: {}, ref: "1" }));
				};
				ws.onmessage = event => {
					try {
						const message = JSON.parse(event.data);
						if (message.event === "postgres_changes") receiveFrames();
					} catch (_) {}
				};
				ws.onclose = () => setTimeout(startRealtime, 3000);
			} catch (_) {}
		}

		async function start() {
			try {
				await readCell();
				document.getElementById("status").textContent = "연결됨 · Virtual Wi-Fi CELL 1";
				await receiveFrames();
				setInterval(receiveFrames, 1000);
				startRealtime();
			} catch (error) {
				console.error(error);
				document.getElementById("status").textContent = "연결 실패: " + error.message;
			}
		}

		start();
	</script>
</body>
</html>
