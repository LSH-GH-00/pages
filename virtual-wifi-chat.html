<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Virtual Wi-Fi Chat</title>
	<style>
		body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 14px}
		#messages{height:420px;overflow:auto;border:1px solid #aaa;padding:10px}
		.message{margin:8px 0;padding:8px;border-bottom:1px solid #ddd}
		.meta{font-size:12px;opacity:.65}
		input,button{font-size:16px;padding:8px;margin:4px 0}
		#text{width:70%}
	</style>
</head>
<body>
	<h1>Virtual Wi-Fi Chat</h1>
	<p>하나의 DB row를 가상 무선 매체처럼 사용하는 채팅 프로토타입</p>
	<input id="mac" placeholder="내 MAC 주소">
	<div id="status">Supabase에 자동 연결 중...</div>
	<div id="messages"></div>
	<form id="form"><input id="text" maxlength="500" placeholder="메시지"><button>전송</button></form>
	<script>
		const SUPABASE_URL='https://uhqdbmofvrontpgtzlxv.supabase.co';
		const SUPABASE_KEY='sb_publishable_pY5uodEIyqFilDstsiV6zA_UUi2yDTz';
		const API=SUPABASE_URL+'/rest/v1/virtual_wifi';
		let cell=[];
		let lastSignature='';
		const $=id=>document.getElementById(id);
		$('mac').value=crypto.randomUUID().replaceAll('-','').slice(0,12).toUpperCase();
		function headers(extra={}){return {'apikey':SUPABASE_KEY,'Content-Type':'application/json',...extra};}
		function render(){
			$('messages').replaceChildren();
			for(const frame of cell){
				if(!frame||frame.type!=='DATA')continue;
				const box=document.createElement('div');
				box.className='message';
				const meta=document.createElement('div');
				meta.className='meta';
				meta.textContent=frame.src+' • seq '+frame.seq;
				const data=document.createElement('div');
				data.textContent=frame.data;
				box.append(meta,data);
				$('messages').append(box);
			}
			$('messages').scrollTop=$('messages').scrollHeight;
		}
		async function readCell(){
			const r=await fetch(API+'?id=eq.1&select=frames',{headers:headers()});
			const body=await r.text();
			if(!r.ok)throw new Error('읽기 오류 '+r.status+': '+body);
			const rows=JSON.parse(body);
			if(!rows.length)throw new Error('CELL 1이 없습니다.');
			const next=rows[0].frames||[];
			const sig=JSON.stringify(next);
			if(sig!==lastSignature){cell=next;lastSignature=sig;render();}
			return true;
		}
		async function connect(){
			try{
				await readCell();
				$('status').textContent='가상 Wi-Fi 연결됨 • CELL 1';
				setInterval(async()=>{try{await readCell();}catch(e){$('status').textContent='수신 오류: '+e.message;}},500);
			}catch(e){$('status').textContent='연결 실패: '+e.message;}
		}
		$('form').onsubmit=async e=>{
			e.preventDefault();
			const text=$('text').value.trim();
			if(!text)return;
			const frame={src:$('mac').value,dst:'FF:FF:FF:FF:FF:FF',type:'DATA',seq:Date.now(),data:text,ts:new Date().toISOString()};
			const next=[...cell,frame].slice(-100);
			$('status').textContent='전송 중...';
			try{
				const r=await fetch(API+'?id=eq.1',{method:'PATCH',headers:headers({'Prefer':'return=representation'}),body:JSON.stringify({frames:next})});
				const body=await r.text();
				if(!r.ok)throw new Error('전송 오류 '+r.status+': '+body);
				const rows=JSON.parse(body);
				if(!rows.length)throw new Error('CELL 1이 실제로 수정되지 않았습니다.');
				cell=rows[0].frames||next;
				lastSignature=JSON.stringify(cell);
				render();
				$('text').value='';
				$('status').textContent='전송 완료 • CELL 1';
			}catch(e){$('status').textContent='전송 실패: '+e.message;}
		};
		connect();
	</script>
</body>
</html>
